version: 2

updates:
  # The workflows pin every action to a commit SHA, which is safe but frozen:
  # nothing tells us when an action ships a fix. Dependabot rewrites the SHA and
  # the version comment together, so upgrades arrive as a reviewable PR rather
  # than as a tag someone else moved.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Nothing is proposed until it has been public for a week. A release that is
    # hours old is both where a hijacked tag would show up first and where the
    # accidental breakage lives; a week is long enough for either to surface
    # somewhere other than this repository.
    cooldown:
      default-days: 7
    # One PR per week covering every action, instead of six that each need their
    # own CI run.
    groups:
      actions:
        patterns: ["*"]
