name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI only ever reads the repository. Nothing here publishes, so the token stays
# read-only instead of inheriting whatever the repository default happens to be.
permissions:
  contents: read

jobs:
  # Runs on macOS rather than Linux: it is the platform the app actually ships
  # for, it compiles the macOS-only keyboard monitor (`key_watch.rs`) that Linux
  # would skip entirely, and it needs none of the GTK/WebKit system packages a
  # Linux runner would have to install first.
  check:
    runs-on: macos-14
    steps:
      # Actions are pinned to full commit SHAs rather than tags: a tag can be
      # moved to point at different code, and these steps run with the workflow
      # token. The trailing comment is the version the SHA came from; Dependabot
      # rewrites both together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      # `toolchain` is spelled out because the pin is the v1 tag rather than the
      # `stable` branch, and only the branch defaults the input for us.
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri

      - run: npm ci

      # Type-checks and builds the frontend. `tauri build` would do this too, but
      # only after a full Rust release build, which is a slow way to learn that a
      # `.ts` file has a type error.
      - name: Build frontend
        run: npm run build

      # No `cargo fmt --check`: this tree is hand-formatted in places rustfmt
      # would rewrite, so the check would fail on code that is deliberate.

      # `--all-targets` pulls in the test targets, which is where tokio's macros
      # feature comes from; the plain build below is what catches a feature the
      # app itself is missing.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        working-directory: src-tauri
        run: cargo build

      # The `#[ignore]`d tests are left out: they spawn the real `claude`, which
      # needs a logged-in subscription no CI runner has.
      - name: Test
        working-directory: src-tauri
        run: cargo test
