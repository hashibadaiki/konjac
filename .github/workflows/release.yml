name: Release

on:
  push:
    tags: ["v*"]
  # Lets a build be rehearsed without publishing anything.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

# Read-only by default, so a job added later starts with the smaller token; the
# three jobs that actually touch the release opt into `write` themselves.
permissions:
  contents: read

jobs:
  # Signing is not a nice-to-have for this app: it asks for Accessibility
  # permission, so whoever installs it has to be able to tie the binary to a
  # known developer. An empty APPLE_SIGNING_IDENTITY makes Tauri skip signing
  # silently, so the missing secret would otherwise only show up as a .dmg
  # nobody can verify. Cheaper to stop here, before two runners spend twenty
  # minutes building something we would refuse to publish.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require the Apple signing and notarisation secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          missing=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
                      APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error::missing Apple secrets:$missing — see README (macOS の署名と公証)"
            exit 1
          fi

          # Only a Developer ID Application certificate produces something
          # Gatekeeper accepts; the Apple Development certificate Xcode makes on
          # its own signs fine and then fails notarisation at the very end.
          case "$APPLE_SIGNING_IDENTITY" in
            "Developer ID Application:"*) ;;
            *)
              echo "::error::APPLE_SIGNING_IDENTITY must be a 'Developer ID Application: …' identity"
              exit 1
              ;;
          esac

          echo "all Apple signing secrets present"

  # The release is created once, up front, so the two build jobs have something
  # to upload to. Letting each of them create-or-find it races when they start at
  # the same moment, which is exactly what a matrix does.
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the draft release
    outputs:
      release_id: ${{ steps.create.outputs.result }}
      tag: ${{ steps.tag.outputs.name }}
    steps:
      # Actions are pinned to full commit SHAs rather than tags: this workflow
      # holds the Apple signing secrets and publishes the installers people
      # download, so a moved tag would be a way to reach both. The trailing
      # comment is the version the SHA came from; Dependabot rewrites the pair.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: tag
        run: echo "name=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # `tauri build` names its artifacts from the version in tauri.conf.json, so
      # a tag that disagrees with it produces a v0.2.0 release full of 0.1.0
      # files. Cheaper to stop here than to work that out from the artifact names.
      - name: Check the tag matches the app version
        run: |
          config=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="${{ steps.tag.outputs.name }}"
          if [ "v$config" != "$tag" ]; then
            echo "tag $tag does not match tauri.conf.json version $config" >&2
            exit 1
          fi

      # Reuses the release if one already exists for the tag, so a re-run after a
      # build failure picks up where it left off instead of dying on
      # "already_exists".
      - id: create
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          result-encoding: string
          script: |
            const tag = '${{ steps.tag.outputs.name }}'
            const { owner, repo } = context.repo

            try {
              const { data } = await github.rest.repos.getReleaseByTag({ owner, repo, tag })
              core.info(`reusing release ${data.id} for ${tag}`)
              return data.id
            } catch (error) {
              if (error.status !== 404) throw error
            }

            const { data } = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: tag,
              draft: true,
              generate_release_notes: true,
            })
            return data.id

  build:
    needs: [preflight, draft]
    strategy:
      # One platform failing should not throw away the other's finished build.
      fail-fast: false
      matrix:
        include:
          # A single universal .dmg rather than one per architecture: it spares
          # everyone downloading it the question of which Mac they have. The
          # runner is an Apple Silicon one either way; the x86_64 half comes
          # from the SDK, not from the machine.
          - platform: macos-15
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - platform: windows-latest
            rust_targets: ""
            args: ""

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write # uploads the installers to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.draft.outputs.tag }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      # `toolchain` is spelled out because the pin is the v1 tag rather than the
      # `stable` branch, and only the branch defaults the input for us.
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing and notarisation. `preflight` has already refused to let the
          # workflow get this far with any of them missing, so an unsigned build
          # here means Tauri failed to use them, not that they are absent.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          args: ${{ matrix.args }}

      # Tauri notarises and staples the .app, then builds the .dmg around it and
      # only signs that. But the .dmg is what the download lands on, so it is
      # the .dmg Gatekeeper assesses first, and a signed-but-unnotarised one is
      # refused — `rejected / source=Unnotarized Developer ID` — before the app
      # inside gets a say. Apple's advice is to notarise the image you ship, so
      # that is what this does; the tickets are per-file and the app keeps its
      # own.
      - name: Notarise and staple the .dmg
        if: runner.os == 'macOS'
        id: dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          dmgs=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "::error::expected exactly one built .dmg, found ${#dmgs[@]}"
            exit 1
          fi
          dmg="${dmgs[0]}"
          echo "notarising $dmg"

          # Everything inside has already been through the notary service, so
          # this pass is about the image itself and comes back in well under a
          # minute. `--wait` also turns a rejection into a non-zero exit here
          # rather than a confusing stapler failure two lines down.
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"

          echo "path=$dmg" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$dmg")" >> "$GITHUB_OUTPUT"

      # tauri-action has already uploaded the unstapled .dmg by this point, so
      # the stapled one has to go up over it. Deleting first because the upload
      # endpoint refuses a name that is already taken rather than replacing it.
      - name: Replace the .dmg on the release with the stapled one
        if: runner.os == 'macOS'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DMG_PATH: ${{ steps.dmg.outputs.path }}
          DMG_NAME: ${{ steps.dmg.outputs.name }}
        with:
          script: |
            const fs = require('fs')
            const { owner, repo } = context.repo
            const release_id = ${{ needs.draft.outputs.release_id }}
            const name = process.env.DMG_NAME
            const data = fs.readFileSync(process.env.DMG_PATH)

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id, per_page: 100,
            })
            for (const asset of assets.filter((a) => a.name === name)) {
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id })
            }

            // The headers are spelled out because the default JSON content type
            // would have Octokit treat a 4 MB Buffer as a body to serialise.
            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id, name, data,
              headers: {
                'content-type': 'application/octet-stream',
                'content-length': data.length,
              },
            })
            core.info(`replaced ${name} with the stapled build (${data.length} bytes)`)

  # Checks the file that people will actually download, pulled back out of the
  # draft release, rather than the build tree it came from. A .dmg that is fine
  # on the build runner and broken as an upload is exactly the failure this is
  # here to catch. Everything below runs against the mounted image.
  verify:
    needs: [draft, build]
    runs-on: macos-15
    permissions:
      # `write` for what reads like a read: a draft release is invisible to a
      # token that only has `contents: read`, so listing its assets comes back
      # 403 rather than empty. Attaching the checksums and editing the notes
      # need it for the usual reason.
      contents: write
    steps:
      - name: Download the release assets
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs')
            const { owner, repo } = context.repo
            const release_id = ${{ needs.draft.outputs.release_id }}

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id, per_page: 100,
            })
            if (assets.length === 0) throw new Error('the release has no assets')

            fs.mkdirSync('assets', { recursive: true })
            for (const asset of assets) {
              // The browser_download_url 404s while the release is a draft, so
              // the asset has to come through the API with an octet-stream
              // Accept header.
              const { data } = await github.request(
                'GET /repos/{owner}/{repo}/releases/assets/{asset_id}',
                { owner, repo, asset_id: asset.id, headers: { accept: 'application/octet-stream' } },
              )
              fs.writeFileSync(`assets/${asset.name}`, Buffer.from(data))
              core.info(`downloaded ${asset.name} (${asset.size} bytes)`)
            }

      - name: Verify the .dmg is signed, notarised and stapled
        run: |
          set -euo pipefail
          shopt -s nullglob

          dmgs=(assets/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "::error::expected exactly one .dmg on the release, found ${#dmgs[@]}"
            exit 1
          fi
          dmg="${dmgs[0]}"
          echo "verifying $dmg"

          # The disk image carries its own signature and notarisation ticket.
          # Stapling matters because it is what lets a first launch succeed with
          # no network: without the ticket, Gatekeeper has to ask Apple.
          codesign --verify --strict --verbose=2 "$dmg"
          xcrun stapler validate "$dmg"

          # `|| true` so a rejection reaches the log as the message spctl wrote
          # rather than as a bare non-zero exit; the check below still fails it.
          assess=$(spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg" 2>&1) || true
          echo "$assess"
          case "$assess" in
            *"source=Notarized Developer ID"*) ;;
            *)
              echo "::error::the .dmg is not accepted as a Notarized Developer ID"
              exit 1
              ;;
          esac

      - name: Verify the .app inside the .dmg
        run: |
          set -euo pipefail
          shopt -s nullglob

          dmg=$(ls assets/*.dmg)
          mount=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
          trap 'hdiutil detach "$mount" -quiet || true' EXIT

          apps=("$mount"/*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "::error::expected exactly one .app in the .dmg, found ${#apps[@]}"
            exit 1
          fi
          app="${apps[0]}"
          echo "verifying $app"

          # --deep so the two slices of the universal binary and every nested
          # framework are checked, --strict so a resource added after signing is
          # an error rather than a warning.
          codesign --verify --deep --strict --verbose=2 "$app"

          details=$(codesign --display --verbose=4 "$app" 2>&1) || true
          echo "$details"
          case "$details" in
            *"Authority=Developer ID Application:"*) ;;
            *)
              echo "::error::the .app is not signed with a Developer ID Application certificate"
              exit 1
              ;;
          esac
          case "$details" in
            *"TeamIdentifier=not set"* | *"Signature=adhoc"*)
              echo "::error::the .app carries an ad-hoc signature, not a team's"
              exit 1
              ;;
          esac

          # This is the check that fails when notarisation was skipped or the
          # ticket never came back: a signed-but-unnotarised app assesses as
          # "source=Developer ID" without the "Notarized".
          assess=$(spctl --assess --type execute --verbose=4 "$app" 2>&1) || true
          echo "$assess"
          case "$assess" in
            *"source=Notarized Developer ID"*) ;;
            *)
              echo "::error::the .app is not accepted as a Notarized Developer ID"
              exit 1
              ;;
          esac

          xcrun stapler validate "$app"

      # Published so that anyone can check the file they downloaded is the file
      # this workflow built, which is the other half of being able to trust an
      # app that asks for Accessibility permission.
      - name: Generate the SHA-256 checksums
        id: sums
        run: |
          set -euo pipefail

          # A re-run downloads the previous run's checksum file along with
          # everything else; hashing it into its own successor is not useful.
          rm -f assets/SHA256SUMS.txt
          (cd assets && shasum -a 256 -- *) > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach the checksums to the release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs')
            const { owner, repo } = context.repo
            const release_id = ${{ needs.draft.outputs.release_id }}
            const name = 'SHA256SUMS.txt'
            const sums = fs.readFileSync(name, 'utf8')

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id, per_page: 100,
            })
            for (const asset of assets.filter((a) => a.name === name)) {
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id })
            }
            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id, name, data: sums,
            })

            // Also in the notes, where someone comparing a hash by eye will
            // actually look. The marker keeps a re-run replacing its own
            // section instead of stacking another copy underneath.
            const marker = '<!-- sha256sums -->'
            const section = `${marker}\n\n## チェックサム (SHA-256)\n\n\`\`\`\n${sums}\`\`\`\n`
            const { data } = await github.rest.repos.getRelease({ owner, repo, release_id })
            const body = data.body || ''
            const kept = body.includes(marker) ? body.slice(0, body.indexOf(marker)) : `${body}\n\n`

            // `tag_name` is repeated on the way past because leaving it out of a
            // PATCH does not leave it alone: a draft release quietly loses the
            // tag it was created with and takes GitHub's `untagged-…`
            // placeholder instead, which `publish` then turns into a real tag
            // of that name. Every updateRelease call here has to carry it.
            await github.rest.repos.updateRelease({
              owner, repo, release_id,
              tag_name: '${{ needs.draft.outputs.tag }}',
              body: kept + section,
            })

  # Only flips the release visible once both platforms have uploaded and the
  # macOS artifact has been verified, so nobody finds a release carrying just one
  # of the two installers — or a .dmg that cannot be traced back to us.
  publish:
    needs: [draft, build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write # flips the release out of draft
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // `tag_name` for the reason spelled out in `verify`: a PATCH that
            // omits it takes the tag away rather than leaving it be, and this
            // is the call that would publish the result under the placeholder.
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.draft.outputs.release_id }},
              tag_name: '${{ needs.draft.outputs.tag }}',
              draft: false,
            })
