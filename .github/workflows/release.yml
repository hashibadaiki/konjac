name: Release

on:
  push:
    tags: ["v*"]
  # Lets a build be rehearsed without publishing anything.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

# Read-only by default, so a job added later starts with the smaller token; the
# three jobs that actually touch the release opt into `write` themselves.
permissions:
  contents: read

jobs:
  # The release is created once, up front, so the two build jobs have something
  # to upload to. Letting each of them create-or-find it races when they start at
  # the same moment, which is exactly what a matrix does.
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the draft release
    outputs:
      release_id: ${{ steps.create.outputs.result }}
      tag: ${{ steps.tag.outputs.name }}
    steps:
      # Actions are pinned to full commit SHAs rather than tags: this workflow
      # holds the Apple signing secrets and publishes the installers people
      # download, so a moved tag would be a way to reach both. The trailing
      # comment is the version the SHA came from; Dependabot rewrites the pair.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - id: tag
        run: echo "name=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # `tauri build` names its artifacts from the version in tauri.conf.json, so
      # a tag that disagrees with it produces a v0.2.0 release full of 0.1.0
      # files. Cheaper to stop here than to work that out from the artifact names.
      - name: Check the tag matches the app version
        run: |
          config=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="${{ steps.tag.outputs.name }}"
          if [ "v$config" != "$tag" ]; then
            echo "tag $tag does not match tauri.conf.json version $config" >&2
            exit 1
          fi

      # Reuses the release if one already exists for the tag, so a re-run after a
      # build failure picks up where it left off instead of dying on
      # "already_exists".
      - id: create
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          result-encoding: string
          script: |
            const tag = '${{ steps.tag.outputs.name }}'
            const { owner, repo } = context.repo

            try {
              const { data } = await github.rest.repos.getReleaseByTag({ owner, repo, tag })
              core.info(`reusing release ${data.id} for ${tag}`)
              return data.id
            } catch (error) {
              if (error.status !== 404) throw error
            }

            const { data } = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: tag,
              draft: true,
              generate_release_notes: true,
            })
            return data.id

  build:
    needs: draft
    strategy:
      # One platform failing should not throw away the other's finished build.
      fail-fast: false
      matrix:
        include:
          # A single universal .dmg rather than one per architecture: it spares
          # everyone downloading it the question of which Mac they have.
          - platform: macos-14
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - platform: windows-latest
            rust_targets: ""
            args: ""

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write # uploads the installers to the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.draft.outputs.tag }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      # `toolchain` is spelled out because the pin is the v1 tag rather than the
      # `stable` branch, and only the branch defaults the input for us.
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing and notarisation. All of these are absent until the Apple
          # secrets are added to the repository, and Tauri simply skips signing
          # when APPLE_SIGNING_IDENTITY is empty — so this workflow produces a
          # working (if unsigned) .dmg before any of that is set up.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          args: ${{ matrix.args }}

  # Only flips the release visible once both platforms have uploaded, so nobody
  # finds a release carrying just one of the two installers.
  publish:
    needs: [draft, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # flips the release out of draft
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.draft.outputs.release_id }},
              draft: false,
            })
