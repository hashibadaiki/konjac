[package]
name = "konjac"
version = "0.2.0"
description = "Shortcut-driven translator running PLaMo 3 Translate on device"
edition = "2021"
rust-version = "1.77"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hashibadaiki/konjac"
# This is the application crate, not a library anyone depends on. Keep it off
# crates.io so a stray `cargo publish` cannot take the name.
publish = false

[lib]
name = "konjac_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The window is undecorated and hidden from the taskbar, so the tray icon is
# what keeps it reachable once it has been dismissed. `macos-private-api` is
# what `macOSPrivateApi` in tauri.conf.json requires: without it the build
# refuses the transparent window the rounded slab is drawn in.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "process", "io-util", "time", "rt"] }
# Fetches the model weights from Hugging Face, once, the first time a size is
# used. Translation itself never touches the network.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "system-proxy"] }
# A downloaded model is only moved into place once it hashes to what Hugging
# Face lists for it.
sha2 = "0.10"
# PLaMo 3 Translate runs in-process through llama.cpp. Pinned to a git
# revision, not a crates.io release: PFN's official GGUFs declare the `plamo3`
# tokenizer, which the llama.cpp bundled with 0.1.161 (the newest release)
# rejects as "unknown tokenizer". This revision (0.1.162, ggml 0.28) knows it,
# and is the one `conao3/rust-plamo-tr-local` translates with. Move back to a
# crates.io version once one ships with it. Default features are off because
# they pull in OpenMP, which would have to ship alongside the app.
llama-cpp-2 = { git = "https://github.com/utilityai/llama-cpp-rs", rev = "0364f5da1c6a6ee37f507031f116ce4a09b28594", default-features = false }

[dev-dependencies]
# `#[tokio::test]` needs the attribute macro; the app itself does not.
tokio = { version = "1", features = ["macros", "rt"] }

# Double-copy detection needs the platform's clipboard change counter, which
# increments even when the same text is copied twice.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSPasteboard",
  "NSEvent",
  "block2",
] }
# `AXIsProcessTrustedWithOptions` takes a `CFDictionaryRef`, and `NSDictionary`
# is toll-free bridged to one — so the options can be built without pulling in
# CoreFoundation bindings of their own.
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSDictionary",
  "NSString",
  "NSValue",
] }
# Every layer on the GPU. Without this the model runs on the CPU, several times
# slower.
llama-cpp-2 = { git = "https://github.com/utilityai/llama-cpp-rs", rev = "0364f5da1c6a6ee37f507031f116ce4a09b28594", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_DataExchange"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
